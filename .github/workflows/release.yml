name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 发布流程（维护者）：
#   1. 同步三处版本号：package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. 本工作流自动构建 Windows/Linux 安装包（Windows 含 portable.exe）并创建 Draft Release，
#      检查后人工 Publish。
# version-guard 校验 tag 与三处版本严格一致，不一致则两个构建 job 均不启动。

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        run: bash .github/scripts/check-tag-version.sh

  windows-release:
    needs: version-guard
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCR-UOJtool v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

      # portable.exe：裸 exe 已静态链接 vcruntime，仅依赖系统 WebView2
      - name: Prepare portable executable
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/ccr-uojtool.exe "CCR-UOJtool_${VERSION}_x64-portable.exe"

      # draft: true 为必需——复用 tauri-action 创建的 Draft 时不传会被自动 Publish
      - name: Upload portable executable to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: CCR-UOJtool_*_x64-portable.exe

  linux-release:
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 与 ci.yml 相同的依赖清单：tauri 在 Linux 链接 webkit2gtk，AppImage 打包也需要
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CCR-UOJtool v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 依赖树（needs 表达）：
#   Windows：windows-compile -> { windows-unit, windows-e2e }
#   Linux：  { linux-unit, linux-e2e }（编译由 cargo test 隐式覆盖，无独立编译门禁）
# 同平台三个 job 共享 rust-cache（shared-key），避免拆分后重复全量编译。

jobs:
  # ---- Windows：编译测试（门禁）----
  windows-compile:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ---- 编译测试 ----
      - name: Type-check & build frontend (tsc + vite)
        run: npm run build

      - name: Rust fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # ---- Windows：unit test（依赖编译门禁）----
  windows-unit:
    needs: windows-compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust unit + integration tests
        run: cargo test --lib --tests
        working-directory: src-tauri

  # ---- Windows：e2e test（依赖编译门禁；纯 Rust，无需 Node）----
  windows-e2e:
    needs: windows-compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-src-tauri

      - name: Engine e2e tests
        run: cargo test --test export_e2e
        working-directory: src-tauri

  # ---- Linux：unit test（无编译门禁；tauri 依赖链接 webkit2gtk，编译期即需要）----
  linux-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust unit + integration tests
        run: cargo test --lib --tests
        working-directory: src-tauri

  # ---- Linux：e2e test（纯 Rust，无需 Node）----
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Engine e2e tests
        run: cargo test --test export_e2e
        working-directory: src-tauri

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 依赖树 1：Windows 平台 编译测试 -> {unit test 和 e2e}
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ---- 编译测试（门禁，失败则后续步骤不执行）----
      - name: Type-check & build frontend (tsc + vite)
        run: npm run build

      - name: Rust fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # ---- unit test ----
      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust unit + integration tests
        run: cargo test --lib --tests
        working-directory: src-tauri

      # ---- e2e test（引擎级：真实夹具 → 导出 zip → 校验内容）----
      - name: Engine e2e tests
        run: cargo test --test export_e2e
        working-directory: src-tauri

  # 依赖树 2：Linux 平台 unit + e2e（编译由 cargo test 隐式覆盖）
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tauri 依赖在 Linux 上链接 webkit2gtk，cargo test 编译期即需要
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # ---- unit test ----
      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Rust unit + integration tests
        run: cargo test --lib --tests
        working-directory: src-tauri

      # ---- e2e test ----
      - name: Engine e2e tests
        run: cargo test --test export_e2e
        working-directory: src-tauri

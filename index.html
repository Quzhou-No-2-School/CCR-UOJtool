<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCR-UOJtool</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="app-header">
      <div class="brand">
        <h1>CCR-UOJtool</h1>
        <span class="subtitle">CCR-Plus 比赛 → UOJ / Hydro 数据包</span>
      </div>
      <div class="toolbar">
        <button id="btn-open-dir" type="button">打开比赛目录</button>
        <button id="btn-import-zip" type="button">导入比赛 zip</button>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button id="btn-choose-out" type="button">选择输出目录…</button>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button id="btn-export-uoj" type="button" class="primary" disabled>导出 UOJ</button>
        <button id="btn-export-hydro" type="button" class="primary" disabled>导出 Hydro</button>
        <button id="btn-export-both" type="button" class="primary" disabled>导出两者</button>
      </div>
    </header>

    <div id="statusbar">
      <span id="contest-info">未打开比赛：请先打开比赛目录或导入比赛 zip</span>
      <span id="out-dir-info">输出目录：未选择</span>
    </div>

    <main id="app-main">
      <aside id="problem-list" aria-label="题目列表"></aside>
      <section id="problem-detail" aria-label="题目详情"></section>
    </main>

    <dialog id="report-dialog">
      <div class="dialog-header">
        <h2>导出报告</h2>
        <button id="btn-report-close" type="button">关闭</button>
      </div>
      <p id="report-summary"></p>
      <div id="report-body"></div>
    </dialog>

    <div id="toast" hidden></div>
  </body>
</html>
